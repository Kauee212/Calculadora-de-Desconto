<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Desconto</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">

        <h1>Calculadora de Desconto</h1>

        <p>Digite o valor da sua compra para calcular o desconto.</p>

        <div class="campo">
            <label for="compra">Valor da compra (R$)</label>

            <input
                type="number"
                id="compra"
                placeholder="Ex: 250.00"
                min="0"
                step="0.01"
            >
        </div>

        <button onclick="calcularDesconto()">
            Calcular desconto
        </button>

        <div class="resultado">

            <h2>Resumo da compra</h2>

            <p>
                Valor da compra:
                <span id="valorCompra">R$ 0,00</span>
            </p>

            <p>
                Valor do desconto:
                <span id="valorDesconto">R$ 0,00</span>
            </p>

            <hr>

            <h3>
                Total a pagar:
                <span id="valorFinal">R$ 0,00</span>
            </h3>

        </div>

    </main>

    <script src="main.js"></script>

</body>
</html>
